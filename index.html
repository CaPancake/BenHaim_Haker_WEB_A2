<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animal CNN Classifier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="index.html">Classifier</a>
    <a href="explanation.html">CNN Explanation</a>
  </nav>

  <main>
    <h1>Animal CNN Classifier</h1>
    <p>Upload an image and the model will classify it as cat, dog, or horse.</p>

    <input type="file" id="imageInput" accept="image/*" />

    <br><br>

    <img id="preview" alt="Image preview" style="max-width: 250px; display: none;" />

    <br><br>

    <button id="predictBtn">Predict</button>

    <p id="modelStatus">Loading model...</p>
    <h2 id="result">Prediction will appear here.</h2>

    <canvas id="canvas" width="32" height="32" style="display: none;"></canvas>
    
    <section id="training" style="margin-top: 24px;">
      <h3>Training Controls</h3>
      <div class="controls" style="display:flex;gap:16px;align-items:flex-start;">
        <div class="control-inputs" style="display:flex;flex-direction:column;gap:8px;">
          <label>Number of layers: <input type="number" id="layersInput" value="3" min="1"/></label>
          <label>Filter size: <input type="number" id="filterSizeInput" value="3" min="1"/></label>
          <label>Number of filters: <input type="number" id="numFiltersInput" value="16" min="1"/></label>
          <label>Learning rate: <input type="number" step="0.0001" id="learningRateInput" value="0.001" min="0"/></label>
          <label>Number of epochs: <input type="number" id="epochsInput" value="10" min="1"/></label>
          <button id="trainBtn">Train</button>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
