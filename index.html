<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Animal CNN Classifier</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <a href="index.html">Classifier</a>
    <a href="explanation.html">CNN Explanation</a>
  </nav>

  <main>
    <h1>Animal CNN Classifier</h1>
    <p>Upload an image and the model will classify it as cat, dog, or horse.</p>

    <input type="file" id="imageInput" accept="image/*" />

    <br><br>

    <img id="preview" alt="Image preview" style="max-width: 250px; display: none;" />

    <br><br>

    <button id="predictBtn">Predict</button>
    <label style="margin-left: 12px;"><input type="checkbox" id="useJsModel"> Use JS Model</label>

    <p id="modelStatus">Loading model...</p>
    <h2 id="result">Prediction will appear here.</h2>

    <canvas id="canvas" width="32" height="32" style="display: none;"></canvas>
    
    <section id="training" style="margin-top: 24px;">
      <h3>Training Controls</h3>
      <div class="controls" style="display:flex;gap:16px;align-items:flex-start;">
        <div class="control-inputs" style="display:flex;flex-direction:column;gap:8px;">
          <label>Number of layers: <input type="number" id="layersInput" value="3" min="1"/></label>
          <label>Filter size: <input type="number" id="filterSizeInput" value="3" min="1"/></label>
          <label>Number of filters: <input type="number" id="numFiltersInput" value="16" min="1"/></label>
          <label>Learning rate: <input type="number" step="0.0001" id="learningRateInput" value="0.001" min="0"/></label>
          <label>Number of epochs: <input type="number" id="epochsInput" value="10" min="1"/></label>
          <label>Training images: <input type="file" id="trainDataInput" accept="image/*" multiple></label>
          <button id="trainBtn">Train</button>
           <button id="loadCifarBtn">Load CIFAR10 Sample</button>
           <p id="trainStatus" style="margin:0;font-size:0.9em;color:#333"></p>           <div id="trainProgress" style="margin-top:8px;display:none;">
             <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px;">
               <div style="flex:1;height:24px;background:#e0e0e0;border-radius:4px;overflow:hidden;">
                 <div id="progressBar" style="height:100%;background:linear-gradient(90deg,#4CAF50,#45a049);width:0%;transition:width 0.3s;display:flex;align-items:center;justify-content:center;color:white;font-size:0.75em;font-weight:bold;"></div>
               </div>
               <span id="progressPercent" style="font-size:0.85em;min-width:40px;">0%</span>
             </div>
             <div style="font-size:0.8em;color:#666;display:flex;gap:16px;">
               <span>Elapsed: <span id="elapsedTime">0:00</span></span>
               <span>Est. remaining: <span id="remainingTime">--:--</span></span>
             </div>
           </div>           <div id="trainProgressLog" style="margin-top:8px;max-height:120px;overflow-y:auto;font-size:0.85em;color:#555;font-family:monospace;background:#f5f5f5;padding:6px;border-radius:3px;display:none;"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
